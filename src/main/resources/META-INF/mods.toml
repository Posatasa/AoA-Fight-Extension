modLoader="javafml"
loaderVersion="[36,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
AoA Fight Extension - an add-on for Advent of Ascension 3 (Minecraft 1.16.5, AoA3 3.6.11).

Features are added incrementally; this build includes the Armor Trans Table.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[36,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.16.5,1.17)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aoa3"
    mandatory=true
    # AoA versions the whole mod: "1.16.5-3.6.11". A "[3.6.11,)" range never matches
    # because component-wise comparison sees the leading "1.16.5" and sorts below "3".
    versionRange="[1.16.5-3.6.11,)"
    ordering="AFTER"
    side="BOTH"
