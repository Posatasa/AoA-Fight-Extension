buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = mod_group
archivesBaseName = mod_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version, 'mod_id': mod_id, 'mod_name': mod_name,
                'mod_license': mod_license, 'mod_authors': mod_authors
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Dfile.encoding=UTF-8']
}

// Copy the reobfuscated jar into dist/ so a ready-to-use file can be committed and downloaded.
def reobfJarOutput = layout.buildDirectory.file('reobfJar/output.jar')

tasks.register('dist', Copy) {
    group = 'build'
    description = 'Copies the reobfuscated jar to dist/ for download.'
    dependsOn tasks.named('reobfJar')
    from({ reobfJarOutput.get().asFile })
    into(layout.projectDirectory.dir('dist'))
    rename { "${mod_id}-${project.version}.jar" }
}

tasks.named('build') {
    dependsOn tasks.named('dist')
}
